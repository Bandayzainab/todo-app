<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Taskboard</h1>
        <p id="progressText">0 of 0 done</p>
      </div>
      <div class="ring" aria-hidden="true"><span id="ringText">0%</span></div>
    </header>

    <section class="composer">
      <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120" aria-label="Task title">
      <div class="composer-row">
        <label class="btn ghost">
          <span>Attach image</span>
          <input type="file" id="imgInput" accept="image/*" hidden>
        </label>
        <div id="preview"></div>
        <span class="spacer"></span>
        <button class="btn ghost" id="cancelBtn" hidden>Cancel</button>
        <button class="btn primary" id="saveBtn">Add task</button>
      </div>
      <p class="msg" id="msg" role="alert"></p>
    </section>

    <nav class="filters" aria-label="Filter tasks">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="done">Done</button>
    </nav>

    <ul id="list" class="list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
